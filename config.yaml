# Конфигурация инструмента анализа маркетплейсов.
# Меняйте значения здесь — код трогать не нужно.

marketplaces:
  wildberries:
    enabled: true
    top_n: 20               # сколько карточек брать по каждому запросу
    dest: -1257786          # регион доставки WB (по умолчанию — Москва)
    request_delay_sec: 1.5  # пауза между запросами, чтобы не ловить бан
    rate_limit_pause_sec: 15  # пауза, если WB ответил 429 («слишком часто»)
    timeout_sec: 20
    retries: 3
    abort_after_failed_queries: 3  # столько пустых запросов подряд -> переходим на fallback
  ozon:
    enabled: false          # задел на будущее, коллектора пока нет

input:
  queries_file: data/queries.csv

output:
  products_file: data/products.csv
  raw_wb_file: data/raw_wb_products.json
  sample_file: data/sample_products.csv
  reports_dir: reports

analysis:
  currency: RUB
  min_reviews_for_strong_card: 100
  top_brands_limit: 3
  top_words_limit: 8
  price_buckets:
    - [0, 500]
    - [500, 800]
    - [800, 1200]
    - [1200, 2000]
    - [2000, 999999]
  # Классификация формата товара по словам в названии.
  # Ключ — название формата, значение — список подстрок (нижний регистр).
  formats:
    набор: ["набор", "комплект", "2 шт", "3 шт", "4 шт", "5 шт", "6 шт", "2шт", "3шт", "4шт"]
    подарочный набор: ["подарочн", "подарок", "в коробке", "в подарочной"]
    банное: ["банное", "банных", "70х140", "70*140", "70x140", "80х150", "большое"]
    для лица: ["для лица", "лицевое", "50х90", "50*90", "50x90", "30х50", "40х70"]
    бамбук: ["бамбук"]
    хлопок: ["хлопок", "хлопков", "cotton"]
    махровое: ["махров"]
    эко: ["эко", "органическ", "organic", "натуральн"]
